syntax = "proto3";

package netra.v1;

option go_package = "github.com/trick77/netra/internal/shared/gen/netra/v1;netrav1";

// IngestRequest is one POST body from an agent to the hub.
message IngestRequest {
  // Monotonic per-agent batch sequence. Batches are all-or-nothing, so the
  // hub's ack_seq simply echoes this value once the whole batch is stored;
  // the agent drops the acked batch (and everything older) from its ring
  // buffer.
  uint64 seq = 1;

  // 8-byte hash of the static metadata block. The hub compares it against the
  // stored value and asks for a resend on mismatch.
  bytes metadata_hash = 2;

  // Populated only when the hub set request_metadata on a previous response.
  Metadata metadata = 3;

  repeated HostSample host_samples = 4;

  // True when these samples are replayed from the ring buffer after an
  // outage. Informational only: TimescaleDB records continuous-aggregate
  // invalidations automatically on INSERT into an older chunk, so the hub
  // needs no explicit action on this flag. It exists so the hub can log
  // backfill activity for observability.
  bool backfill = 5;

  // Per-entity families ride here rather than on HostSample: host_samples is
  // repeated, so a replayed batch spans many scrapes and these rows cannot be
  // positionally associated with one host row. Each carries its own ts_ms.
  repeated CpuCoreSample cpu_cores = 6;
  repeated DiskIoSample disk_io = 7;
  repeated SensorSample sensors = 8;
  repeated NetSample net = 9;
  repeated CollectorSample collectors = 10;
  repeated Event events = 11;
  repeated ContainerSample containers = 12;
  repeated FilesystemSample filesystems = 13;
  repeated SmartAttribute smart = 14;
  repeated ProcessSample processes = 15;
  repeated SystemdUnitEvent systemd_events = 16;
  repeated PackageEvent package_events = 17;

  // Inventory, not samples: these describe what the host HAS rather than what
  // it measured, so they are sent when they change rather than every scrape.
  // They ride the metadata hash the same way capabilities do.
  repeated HostAddress addresses = 18;
  repeated HostPackage packages = 19;
}

// CpuCoreSample is one core's utilisation over one scrape interval. Rows land
// in cpu_core_samples, whose primary key is (host_id, ts, core).
message CpuCoreSample {
  int64 ts_ms = 1;

  // The N in /proc/stat's cpuN, not a physical package or thread id.
  uint32 core = 2;

  // Percentage of the interval the core was neither idle nor in iowait.
  // Unset on the first scrape after start, and after a counter reset, because
  // a rate needs a previous reading the agent does not have yet. Unset is not
  // zero: an idle core reports 0, an unmeasurable one reports nothing.
  optional double busy = 3;
}

// Metadata holds facts that change rarely. Sent once, then only on change.
message Metadata {
  string agent_version = 1;
  string go_version = 2;
  string build_commit = 3;
  string hostname = 4;
  string kernel = 5;
  string os_name = 6;
  string arch = 7;
  string cpu_model = 8;
  uint32 cores = 9;
  uint32 threads = 10;
  uint64 memory_total = 11;
  string location = 12;
  string provider = 13;
  string facility = 14;
  string host_type = 15;
  string fingerprint = 16;

  // Per-collector availability, e.g. {"processes": "namespaced"}. Rides the
  // metadata hash, so a collector that starts or stops being able to run
  // flips the hash and the hub asks for a resend on the next post. The
  // hosts.capabilities JSONB column already exists to receive it.
  map<string, string> capabilities = 17;
}

// HostSample is one scrape of host-level vitals.
//
// Every metric is optional: a field left unset means the subsystem is absent
// (no swap, no ZFS) and must reach the database as NULL, not 0.
message HostSample {
  int64 ts_ms = 1;

  optional double cpu_total = 2;
  optional double cpu_user = 3;
  optional double cpu_system = 4;
  optional double cpu_iowait = 5;
  optional double cpu_steal = 6;
  optional double cpu_idle = 7;

  optional uint64 mem_total = 8;
  optional uint64 mem_used = 9;
  optional uint64 mem_available = 10;
  optional uint64 mem_buffcache = 11;
  optional uint64 mem_zfs_arc = 12;
  optional uint64 swap_total = 13;
  optional uint64 swap_used = 14;

  optional double load1 = 15;
  optional double load5 = 16;
  optional double load15 = 17;

  optional uint64 uptime_s = 18;

  // --- /proc/stat, the lines the CPU collector steps over ---
  //
  // ctxt, intr and processes are monotonic counters. They are reported as
  // per-second rates computed agent-side, not as raw counters: detecting a
  // counter reset needs the previous value, which only the agent holds. The
  // hub never sees the reset and could not correct for one.
  optional double ctxt_per_s = 19;
  optional double intr_per_s = 20;
  optional double forks_per_s = 21;

  // Gauges, so unlike the rates above these are set on the very first scrape.
  optional uint32 procs_running = 22;
  optional uint32 procs_blocked = 23;

  // btime: an absolute unix timestamp, deliberately not derived from
  // uptime_s + ts_ms. That derivation drifts by a second or two per sample,
  // so "when did this host last reboot" would answer slightly differently for
  // every row of the same boot.
  optional uint64 boot_time_s = 24;

  // Count of numeric entries in /proc. Unset -- never 0 -- when the agent is
  // in a PID namespace and can see only itself.
  optional uint32 processes_total = 25;

  // USER_PROCESS records in /var/run/utmp. Unset when utmp is absent, which
  // is the normal case on a host with no utmp writer.
  optional uint32 users_logged_in = 26;

  // systemd unit summary (spec 5.3), filled by the Systemd collector. Both
  // stay NULL on a host with no systemd, which is the honest reading: a host
  // that runs no units is not a host with zero failed units.
  optional uint32 services_total = 27;
  optional uint32 services_failed = 28;

  // --- /proc/net/snmp, Tcp: ---
  //
  // No tcp6_* mirror exists, on purpose. The Tcp: block is the RFC 1213 TCP
  // MIB, which Linux keeps as one family-agnostic counter set: these values
  // already include IPv6 connections. /proc/net/snmp6 has no Tcp6 block at
  // all -- it carries Ip6*, Icmp6* and Udp6* only -- so a tcp6_* field could
  // only duplicate the field above it or be permanently NULL. The IPv6
  // mirrors further down cover exactly what the kernel does account
  // separately, and all three of those blocks are now read.
  optional double tcp_retrans_segs_per_s = 29;
  optional double tcp_out_rsts_per_s = 30;
  optional double tcp_in_errs_per_s = 31;
  optional double tcp_active_opens_per_s = 32;
  optional double tcp_passive_opens_per_s = 33;
  optional double tcp_attempt_fails_per_s = 34;

  // Gauge: connections currently established, not a counter.
  optional uint32 tcp_curr_estab = 35;

  // --- /proc/net/netstat, TcpExt: ---
  optional double tcp_listen_overflows_per_s = 36;
  optional double tcp_listen_drops_per_s = 37;

  // --- /proc/net/snmp, Udp: ---
  optional double udp_in_errors_per_s = 38;
  optional double udp_rcvbuf_errors_per_s = 39;
  optional double udp_sndbuf_errors_per_s = 40;
  optional double udp_no_ports_per_s = 41;

  // --- /proc/net/snmp, Ip: fragmentation and reassembly ---
  optional double ip_reasm_reqds_per_s = 42;
  optional double ip_reasm_fails_per_s = 43;
  optional double ip_frag_fails_per_s = 44;
  optional double ip_frag_creates_per_s = 45;

  // --- /proc/net/snmp6, Udp6 ---
  optional double udp6_in_errors_per_s = 46;
  optional double udp6_rcvbuf_errors_per_s = 47;
  optional double udp6_sndbuf_errors_per_s = 48;
  optional double udp6_no_ports_per_s = 49;

  // --- /proc/net/snmp6, Ip6 fragmentation and reassembly ---
  optional double ip6_reasm_reqds_per_s = 50;
  optional double ip6_reasm_fails_per_s = 51;
  optional double ip6_frag_fails_per_s = 52;
  optional double ip6_frag_creates_per_s = 53;

  // --- /proc/vmstat, memory pressure ---
  //
  // What the memory gauges cannot say. mem_available reports how much memory
  // is free; these report what the machine had to DO to keep it that way. A
  // host can sit at a comfortable 40% used while thrashing.
  //
  // 55-59 are deliberately skipped: they belong to the meminfo split landing
  // in parallel, and reusing a field number across two branches would put two
  // different meanings on one wire tag.
  optional double pgmajfault_per_s = 60;
  optional double pswpin_per_s = 61;
  optional double pswpout_per_s = 62;

  // A cumulative count, not a rate. One OOM kill in a 60s interval is a
  // discrete event an operator must see happened at all; as a per-second rate
  // it rounds to something that reads like noise.
  optional uint64 oom_kill_total = 63;

  // --- Exhaustion gauges: how close the host is to a hard ceiling ---
  //
  // Every one of these has a limit beside it, which is the point. Running out
  // does not present as a resource problem: accept() starts failing and
  // conntrack drops new flows, so the symptom looks like a broken network.
  optional uint32 sockets_used = 64;
  optional uint32 tcp_orphan = 65;
  optional uint32 tcp_tw = 66;
  optional uint32 tcp_alloc = 67;
  optional uint64 fd_used = 68;

  // Named _limit rather than _max on purpose. netra reserves the _max suffix
  // for a BUCKET MAXIMUM in the rollup tiers, so fd_max would read as "the
  // peak descriptor count" beside fd_used_max -- when it is a ceiling that
  // barely moves. Same for conntrack below.
  optional uint64 fd_limit = 69;

  // Unset when the conntrack module is not loaded, which is normal on a host
  // doing neither NAT nor filtering. Absent, not zero.
  optional uint32 conntrack_count = 70;
  optional uint32 conntrack_limit = 71;

  // The ceilings for the socket gauges above, so each has something to be
  // read against. tcp_tw pinned at tcp_max_tw_buckets means the kernel is
  // silently dropping TIME_WAIT sockets, and tcp_orphan at tcp_max_orphans
  // means it is resetting connections -- neither is visible in any other TCP
  // counter, and neither is answerable from the gauge alone.
  optional uint32 tcp_tw_limit = 72;
  optional uint32 tcp_orphan_limit = 73;

  // The agent's own telemetry for this scrape. Singular, not repeated: it is
  // 1:1 with (host_id, ts), so nesting it here means it rides the existing
  // ring buffer, partial drain and backfill paths unchanged, and the hub
  // stores it under the same natural key. It lands in its own table because
  // agent uptime and host uptime are different facts (spec 5.3).
  optional AgentSample agent = 54;

  // --- /proc/meminfo, the fields that make a stacked memory chart honest ---
  //
  // mem_used above is MemTotal - MemAvailable, which already contains the ZFS
  // ARC and the unreclaimable shmem slice of the page cache. Stacking bands
  // on top of it therefore counts the same bytes twice. These five exist so a
  // chart can partition mem_total instead: free + buffers + cached + shared +
  // sreclaimable are measured, and "used" is whatever is left over.
  //
  // Appended here rather than beside mem_buffcache because field numbers are
  // never renumbered -- the numbering follows arrival order throughout this
  // message.
  optional uint64 mem_free = 55;
  optional uint64 mem_buffers = 56;
  // Cached MINUS Shmem. /proc/meminfo's Cached includes the tmpfs pages that
  // Shmem counts, so storing both verbatim would double-count them in a
  // stack. Splitting it here rather than in the UI keeps the invariant
  // mem_buffcache == mem_buffers + mem_cached + mem_shared true in the
  // database, where it can be asserted.
  optional uint64 mem_cached = 57;
  optional uint64 mem_shared = 58;
  // Reclaimable slab. Not part of Buffers or Cached, and counted as available
  // by the kernel, so a stack that omits it under-reports the cache rather
  // than over-reporting memory pressure.
  optional uint64 mem_sreclaimable = 59;

  // --- /proc/net/snmp and /proc/net/snmp6: the IP and ICMP MIBs ---
  //
  // These seventy land in host_snmp_samples, NOT host_samples, and that is
  // load-bearing rather than tidiness. A TimescaleDB continuous aggregate
  // cannot gain a column: adding one to host_samples means dropping and
  // recreating host_samples_5m and host_samples_1h, which re-materialises
  // only from the seven days of raw still on disk and destroys every
  // rolled-up host metric older than that -- CPU and memory included. A
  // separate table with its own aggregates costs one read family and loses
  // nothing. Do not "tidy" them into InsertHostSamples.
  //
  // The set is deliberately wider than what the UI charts today, for the same
  // reason: a counter added later costs a drop-and-recreate, while a counter
  // stored and never drawn costs a column.
  //
  // IcmpMsg: is NOT parsed. Its column names are per-ICMP-type and depend on
  // which types the host has actually seen (InType3 InType8 OutType0 ...), so
  // no fixed field set can be derived from it, and readPaired's zip-by-
  // position would attribute one host's InType3 to another's InType8. The
  // named Icmp: counters below cover the types worth charting: DestUnreachs
  // is type 3 and Echos is type 8.

  // --- Ip: volume ---
  optional double ip_in_receives_per_s = 74;
  optional double ip_in_delivers_per_s = 75;
  optional double ip_out_requests_per_s = 76;
  optional double ip_forw_datagrams_per_s = 77;
  optional double ip_reasm_oks_per_s = 78;
  optional double ip_frag_oks_per_s = 79;

  // --- Ip: loss and error ---
  optional double ip_in_hdr_errors_per_s = 80;
  optional double ip_in_addr_errors_per_s = 81;
  optional double ip_in_unknown_protos_per_s = 82;
  optional double ip_in_discards_per_s = 83;
  optional double ip_out_discards_per_s = 84;
  optional double ip_out_no_routes_per_s = 85;
  optional double ip_reasm_timeout_per_s = 86;

  // --- Ip6*, from /proc/net/snmp6 ---
  //
  // Three have no IPv4 peer, and their absence above is the kernel's, not an
  // omission here: the Ip: block has no InNoRoutes at all, and "packet too
  // big" is an ICMPv6 fact that IPv4 records as fragmentation instead.
  optional double ip6_in_receives_per_s = 87;
  optional double ip6_in_delivers_per_s = 88;
  optional double ip6_out_requests_per_s = 89;
  optional double ip6_out_forw_datagrams_per_s = 90;
  optional double ip6_reasm_oks_per_s = 91;
  optional double ip6_frag_oks_per_s = 92;
  optional double ip6_in_hdr_errors_per_s = 93;
  optional double ip6_in_addr_errors_per_s = 94;
  optional double ip6_in_unknown_protos_per_s = 95;
  optional double ip6_in_discards_per_s = 96;
  optional double ip6_out_discards_per_s = 97;
  optional double ip6_out_no_routes_per_s = 98;
  optional double ip6_in_no_routes_per_s = 99;
  optional double ip6_in_too_big_errors_per_s = 100;
  optional double ip6_reasm_timeout_per_s = 101;

  // --- Icmp: error and control ---
  optional double icmp_in_msgs_per_s = 102;
  optional double icmp_out_msgs_per_s = 103;
  optional double icmp_in_errors_per_s = 104;
  optional double icmp_out_errors_per_s = 105;
  optional double icmp_in_dest_unreachs_per_s = 106;
  optional double icmp_out_dest_unreachs_per_s = 107;
  optional double icmp_in_time_excds_per_s = 108;
  optional double icmp_out_time_excds_per_s = 109;
  optional double icmp_in_parm_probs_per_s = 110;
  optional double icmp_out_parm_probs_per_s = 111;
  optional double icmp_in_redirects_per_s = 112;
  optional double icmp_out_redirects_per_s = 113;

  // --- Icmp: informational ---
  //
  // Echo is reachability rather than failure, which is why it is charted on
  // its own panel: a host answering pings is not a host in trouble, and
  // mixing the two axes hides the counters that do mean something.
  optional double icmp_in_echos_per_s = 114;
  optional double icmp_out_echos_per_s = 115;
  optional double icmp_in_echo_reps_per_s = 116;
  optional double icmp_out_echo_reps_per_s = 117;

  // --- Icmp6*, from /proc/net/snmp6 ---
  //
  // Unlike Tcp:, the ICMP MIB is genuinely per-family: Icmp: counts ICMPv4
  // only and snmp6 carries a full Icmp6* block, so both are read. The
  // spellings follow the kernel's icmp6type2name[] table, which is why two
  // differ from their v4 peers -- ParmProblems, not ParmProbs, and
  // EchoReplies, not EchoReps.
  optional double icmp6_in_msgs_per_s = 118;
  optional double icmp6_out_msgs_per_s = 119;
  optional double icmp6_in_errors_per_s = 120;
  optional double icmp6_out_errors_per_s = 121;
  optional double icmp6_in_dest_unreachs_per_s = 122;
  optional double icmp6_out_dest_unreachs_per_s = 123;
  optional double icmp6_in_time_excds_per_s = 124;
  optional double icmp6_out_time_excds_per_s = 125;
  optional double icmp6_in_parm_problems_per_s = 126;
  optional double icmp6_out_parm_problems_per_s = 127;
  optional double icmp6_in_pkt_too_bigs_per_s = 128;
  optional double icmp6_out_pkt_too_bigs_per_s = 129;
  optional double icmp6_in_redirects_per_s = 130;
  optional double icmp6_out_redirects_per_s = 131;
  optional double icmp6_in_echos_per_s = 132;
  optional double icmp6_out_echos_per_s = 133;
  optional double icmp6_in_echo_replies_per_s = 134;
  optional double icmp6_out_echo_replies_per_s = 135;

  // Neighbour discovery. On IPv6 this IS the informational traffic -- there
  // is no ARP, so solicits and advertisements carry what an operator would
  // look for in an ARP table, and a host that stops answering neighbour
  // solicits disappears from its segment.
  optional double icmp6_in_neighbor_solicits_per_s = 136;
  optional double icmp6_out_neighbor_solicits_per_s = 137;
  optional double icmp6_in_neighbor_advertisements_per_s = 138;
  optional double icmp6_out_neighbor_advertisements_per_s = 139;
  optional double icmp6_in_router_solicits_per_s = 140;
  optional double icmp6_out_router_solicits_per_s = 141;
  optional double icmp6_in_router_advertisements_per_s = 142;
  optional double icmp6_out_router_advertisements_per_s = 143;
}

// AgentSample is the agent's telemetry about itself for one scrape.
//
// It carries the full column set of spec 5.3's agent_samples so the table is
// complete on arrival. The fields the Self collector owns stay unset until it
// lands, and unset means NULL rather than a fabricated zero.
message AgentSample {
  // Wall time spent running every collector for this scrape.
  optional uint32 scrape_duration_ms = 1;

  // Round-trip time of the most recent SUCCESSFUL post, as of this scrape.
  //
  // It necessarily lags by one scrape: the RTT of a post is only known inside
  // the post itself, which runs after this sample was built and buffered. It
  // is left unset -- never zeroed -- when the last flush failed, so an outage
  // reads as "no measurement" rather than "instantaneous".
  optional uint32 post_latency_ms = 2;

  // The AGENT's uptime, not the host's. The two differ exactly when the
  // agent restarted alone -- which also means its ring buffer was lost.
  optional uint64 uptime_s = 3;
  // Sys rather than Alloc: what the process took from the OS is what an
  // operator sees in ps, whereas Alloc is Go's live heap and understates it.
  optional uint64 rss_bytes = 4;
  optional uint32 goroutines = 5;

  optional uint32 buffer_depth = 6;
  optional uint64 buffer_dropped_total = 7;

  optional uint64 post_failures_total = 8;

  // --- The network path to the hub, as distinct from the round trip ---
  //
  // post_latency_ms above is the WHOLE post: TLS, upload, the hub's handling,
  // the Postgres write, the response unmarshal. A slow database inflates it
  // exactly like a slow network does, so it cannot answer "is the link bad".
  // These stop at SYN-ACK. The gap between the two is everything the hub does
  // after accepting the connection.
  //
  // Measured with a TCP handshake rather than ICMP: ICMP is handled on the
  // router slow path, routinely rate-limited and often dropped, so a red ICMP
  // graph is as likely to mean a filter as a problem -- and a handshake to the
  // hub's real port traverses the exact path and policy the real traffic uses,
  // with no raw socket and no CAP_NET_RAW.
  //
  // Three handshakes per scrape: the MINIMUM is the best estimator of the true
  // path RTT, being the sample least contaminated by queuing, and the spread
  // to the maximum is jitter.
  //
  // MICROSECONDS, not milliseconds, and that is not premature precision. A
  // hub on the same LAN or in the same datacentre answers in 200-900us, which
  // truncates to a millisecond value of 0 on every scrape -- the exact number
  // the schema declares impossible, since it would claim an instantaneous
  // connection. Worse, min and max would both be 0, so the jitter that is
  // half the reason for three handshakes could never be seen. Rounding does
  // not fix it; only resolution does.
  //
  // Unlike post_latency_ms these do NOT lag a scrape -- the probe runs inside
  // the scrape it is reported with. Both are unset, never zeroed, when no
  // handshake completed: an unreachable hub has no round-trip time, and
  // hub_connect_failures_total is what says so.
  optional uint32 hub_connect_us = 9;
  optional uint32 hub_connect_max_us = 10;
  optional uint64 hub_connect_failures_total = 11;
}

// ProcessSample carries exactly: name, cpu_pct, mem_bytes, count. The rule
// below is why, and it holds for every future field.
//
// `name` is `comm` — /proc/PID/comm, or field 2 of /proc/PID/stat — which the
// kernel caps at 15 bytes. No field may ever carry argv or the environment.
// /proc/PID/cmdline is argv, and argv routinely carries credentials
// (`mysql -p<pass>`, `-Dspring.datasource.password=...`, `--token=...`);
// /proc/PID/environ is worse. Either on the wire turns netra into a credential
// exfiltration path with a database behind it, for an operator who enabled
// `pid: host` to see a CPU chart.
//
// The trap is that the dangerous implementation is the natural one: 15 bytes is
// an unsatisfying name and cmdline has the whole command in it. Enforced by
// internal/agent/collector/argv_guard_test.go, which fails the build rather
// than trusting review. See spec 6.2 for the accepted cost (truncated names,
// "python3" instead of the script).

// IngestResponse carries everything the hub would push over a socket.
message IngestResponse {
  uint64 ack_seq = 1;
  bool request_metadata = 2;

  // Set on a 503 (storage unavailable). The agent waits at least this long
  // before retrying, instead of using its own backoff.
  uint32 retry_after_s = 3;

  // Field 4 was interval_s: a hub-supplied scrape cadence the agent adopted.
  // Retired because the scrape interval is now fixed at 60s agent-side. The
  // hub has no per-host cadence column, so it could only ever hand back one
  // hardcoded constant — which silently overrode whatever the operator had
  // configured on the agent. A per-host override was considered and dropped,
  // so no replacement field is coming; 4 must never be reused.
  reserved 4;
  reserved "interval_s";
}

// Every message below carries its own ts_ms and its own NATURAL key.
//
// ts_ms because IngestRequest.host_samples is repeated: a replayed batch spans
// many scrapes, so these rows cannot be positionally associated with one host
// row and must timestamp themselves.
//
// Natural keys because the agent has no idea what a dimension's surrogate id
// is -- ids are assigned by the hub, which resolves container_key, chip+label,
// device and label to them on ingest. An agent that sent ids would have to
// learn them first, which is a round trip the protocol deliberately does not
// have.

// DiskIoSample is one block device over one scrape interval. Every value is a
// rate the AGENT computed: the kernel counters are monotonic and reset on
// reboot, and only the agent holds the previous reading needed to notice a
// reset. A reset emits no row at all rather than a negative rate or a spike.
message DiskIoSample {
  int64 ts_ms = 1;
  // Kernel name (sda, nvme0n1), whole devices only -- a partition's I/O is
  // already counted in its parent, so reporting both double-counts the host.
  string device = 2;
  optional double read_bytes = 3;
  optional double write_bytes = 4;
  optional double read_ops = 5;
  optional double write_ops = 6;
  optional double io_util_pct = 7;
  optional double r_await_ms = 8;
  optional double w_await_ms = 9;
  optional double weighted_io_pct = 10;
}

// SensorSample is one temperature reading. Identity is chip + label, NEVER
// hwmonN: the N is allocation-order dependent and changes across reboots, so
// keying on it silently reattributes one chip's history to another.
message SensorSample {
  int64 ts_ms = 1;
  string chip = 2;
  string label = 3;

  // Temperature in degrees Celsius. Retained as-is: it is what every
  // existing reader queries, and set only for kind = "temperature".
  optional double temp = 4;

  // What this sensor measures, and therefore what axis it belongs on. A fan
  // at 1200 RPM charted on the same scale as a 45 degree package temperature
  // is the failure this field exists to prevent.
  //
  // One of: temperature, fan, voltage, current, power. Empty from an agent
  // predating this field, which the hub reads as temperature -- the only
  // kind those agents could send.
  string kind = 5;

  // The reading in the kind's own unit: degrees C, RPM, volts, amps, watts.
  //
  // Set for EVERY kind including temperature, where it duplicates temp. That
  // duplication is deliberate: temp stays the column existing queries and
  // panels use, while value is the one column a reader can chart without
  // knowing which kind it asked for.
  optional double value = 6;
}

// NetSample is one interface over one scrape interval. Rates, for the same
// counter-reset reason as DiskIoSample.
//
// iface is the join key with host_addresses.iface -- the two collectors must
// name an interface identically or the address and its traffic cannot be
// related.
message NetSample {
  int64 ts_ms = 1;
  string iface = 2;
  optional double rx_bytes = 3;
  optional double tx_bytes = 4;
  optional double rx_errs = 5;
  optional double tx_errs = 6;
}

// ContainerSample is one container over one scrape interval.
message ContainerSample {
  int64 ts_ms = 1;
  // Compose project + service, falling back to container name (spec 6.2).
  // Deliberately NOT the Docker id, which changes on every recreate -- keying
  // on it would restart the history of a service that merely got a new image.
  string container_key = 2;
  string name = 3;
  string image = 4;
  bool is_agent = 5;
  optional double cpu_pct = 6;
  // Already has cache and inactive_file subtracted. Raw cgroup memory.current
  // counts the page cache as consumption, so a container that merely read
  // files would report that as memory it is holding.
  optional uint64 mem_used = 7;
  optional uint64 mem_limit = 8;
  optional double net_rx = 9;
  optional double net_tx = 10;
  optional double io_read = 11;
  optional double io_write = 12;

  // --- cgroup v2 cpu.stat and memory.stat, the parts cpu_pct and mem_used
  // --- flatten away ---
  //
  // cpu_pct is derived from usage_usec and says how much CPU a container
  // took, not what it was doing with it. These two split that: a service
  // pinned in system time is doing syscalls or contending on the kernel,
  // which is a different problem from one pinned in user time, and the
  // difference decides where an operator looks next. Percentages over the
  // scrape interval, like cpu_pct, so they sum to it.
  optional double cpu_user = 13;
  optional double cpu_system = 14;

  // mem_used is memory.current minus the page cache -- one number that
  // cannot distinguish a container holding 2 GB of heap from one that read
  // 2 GB of files. These are memory.stat's own parts, and they answer
  // whether a limit needs raising or a workload needs fixing.
  //
  // anon is the unreclaimable part: heap and stacks, what an OOM kill is
  // actually about.
  optional uint64 mem_anon = 15;
  // file is the page cache the container caused, reclaimable under pressure.
  optional uint64 mem_file = 16;
  // shmem is tmpfs and shared segments. Counted inside `file` by the kernel,
  // and reported separately here because it is NOT reclaimable the way the
  // rest of the page cache is -- a chart that stacks the two double counts.
  optional uint64 mem_shmem = 17;
  // kernel slab attributed to this cgroup: dentries, inodes, socket buffers.
  // Invisible in mem_used and the usual reason a limit is hit by a container
  // whose heap looks small.
  optional uint64 mem_kernel = 18;
}

// FilesystemSample is one mounted filesystem, deduplicated by st_dev so a bind
// mount of an already-reported filesystem does not double-count the host's
// disk usage.
message FilesystemSample {
  int64 ts_ms = 1;
  string label = 2;
  string mountpoint = 3;
  // st_dev, so the hub can tell two labels naming one filesystem apart from
  // two genuinely distinct ones.
  optional uint64 device_id = 4;
  optional uint64 total = 5;
  optional uint64 used = 6;
  optional uint64 free = 7;
  optional uint64 inodes_total = 8;
  optional uint64 inodes_used = 9;
  // Unset -- not zero -- when the st_dev to block device mapping fails.
  // "Could not attribute I/O to this filesystem" is not "did no I/O".
  optional double read_bytes = 10;
  optional double write_bytes = 11;
}

// SmartAttribute is one SMART attribute of one drive. Deliberately generic:
// attribute sets vary per drive model, so a typed field per attribute would
// need a schema change for every new drive.
message SmartAttribute {
  int64 ts_ms = 1;
  string device = 2;
  string model = 3;
  string serial = 4;
  uint32 attr_id = 5;
  optional int64 raw = 6;
  optional uint32 normalized = 7;
}

// ProcessSample is one process NAME, aggregated across every process sharing
// it -- top-10-by-CPU union top-10-by-memory, not every process on the host.
message ProcessSample {
  int64 ts_ms = 1;
  // comm from /proc/PID/stat. NEVER argv: cmdline and environ carry secrets
  // passed on command lines, and argv_guard_test.go fails the build if either
  // name appears in a Go string literal. The accepted cost is truncated names
  // and "python3" rather than the script (spec 6.2).
  string name = 2;
  optional double cpu_pct = 3;
  optional uint64 mem_bytes = 4;
  // How many processes were aggregated under this name.
  optional uint32 count = 5;
}

// CollectorSample is one collector's own health for one scrape: how long it
// took, whether it worked, and why not.
message CollectorSample {
  int64 ts_ms = 1;
  string collector = 2;
  optional uint32 duration_ms = 3;
  bool ok = 4;
  // Unset when the collector succeeded. A collector that failed once must not
  // read as broken forever, so this clears on recovery rather than sticking.
  optional string error_code = 5;
}

// Event is a discrete state change: mdraid degradation, a SMART threshold
// crossing, a systemd unit failing. Spec 5.1 rule 4 sends anything constant
// for hours here rather than to a sample table -- an array is "clean" for
// weeks, and a 60s series saying so is pure waste.
message Event {
  int64 ts_ms = 1;
  string type = 2;
  // The thing the event is about: an array name, a device, an interface.
  // Empty for events about the host as a whole.
  string subject = 3;
  // JSON object. Kept as a string on the wire so the agent needs no structured
  // representation of something the hub only stores.
  string detail_json = 4;
}

// HostAddress is one address on one interface. The agent reports raw facts
// only: the HUB derives scope (loopback/private/public) from the address, so
// the classification is one implementation that can be corrected without
// redeploying every agent.
message HostAddress {
  string iface = 1;
  optional uint32 if_index = 2;
  string address = 3;
  // 4 or 6. IPv4 and IPv6 are treated identically throughout.
  uint32 family = 4;
  string vrf = 5;
  string description = 6;
}

// HostPackage is one installed package.
message HostPackage {
  string name = 1;
  string version = 2;
  string arch = 3;
  // "dpkg" or "apk". An rpm host reports an unsupported-format capability
  // instead: unsupported is not broken, and they are different facts.
  string format = 4;
  optional uint64 size_bytes = 5;
}

// SystemdUnitEvent is a unit changing state. Events, not samples: a unit's
// state is constant for days, which is the same near-constant-series waste
// that keeps systemd out of 5.3.
message SystemdUnitEvent {
  int64 ts_ms = 1;
  string unit_name = 2;
  string state = 3;
  string substate = 4;
}

// PackageEvent is a package being installed, upgraded or removed.
message PackageEvent {
  int64 ts_ms = 1;
  string name = 2;
  // "install", "upgrade" or "remove".
  string action = 3;
  string from_version = 4;
  string to_version = 5;
}
