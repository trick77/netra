syntax = "proto3";

package netra.v1;

option go_package = "github.com/trick77/netra/internal/gen/netra/v1;netrav1";

// IngestRequest is one POST body from an agent to the hub.
message IngestRequest {
  // Monotonic per-agent batch sequence. Batches are all-or-nothing, so the
  // hub's ack_seq simply echoes this value once the whole batch is stored;
  // the agent drops the acked batch (and everything older) from its ring
  // buffer.
  uint64 seq = 1;

  // 8-byte hash of the static metadata block. The hub compares it against the
  // stored value and asks for a resend on mismatch.
  bytes metadata_hash = 2;

  // Populated only when the hub set request_metadata on a previous response.
  Metadata metadata = 3;

  repeated HostSample host_samples = 4;

  // True when these samples are replayed from the ring buffer after an
  // outage. Informational only: TimescaleDB records continuous-aggregate
  // invalidations automatically on INSERT into an older chunk, so the hub
  // needs no explicit action on this flag. It exists so the hub can log
  // backfill activity for observability.
  bool backfill = 5;
}

// Metadata holds facts that change rarely. Sent once, then only on change.
message Metadata {
  string agent_version = 1;
  string go_version = 2;
  string build_commit = 3;
  string hostname = 4;
  string kernel = 5;
  string os_name = 6;
  string arch = 7;
  string cpu_model = 8;
  uint32 cores = 9;
  uint32 threads = 10;
  uint64 memory_total = 11;
  string location = 12;
  string provider = 13;
  string facility = 14;
  string host_type = 15;
  string fingerprint = 16;

  // Per-collector availability, e.g. {"processes": "namespaced"}. Rides the
  // metadata hash, so a collector that starts or stops being able to run
  // flips the hash and the hub asks for a resend on the next post. The
  // hosts.capabilities JSONB column already exists to receive it.
  map<string, string> capabilities = 17;
}

// HostSample is one scrape of host-level vitals.
//
// Every metric is optional: a field left unset means the subsystem is absent
// (no swap, no ZFS) and must reach the database as NULL, not 0.
message HostSample {
  int64 ts_ms = 1;

  optional double cpu_total = 2;
  optional double cpu_user = 3;
  optional double cpu_system = 4;
  optional double cpu_iowait = 5;
  optional double cpu_steal = 6;
  optional double cpu_idle = 7;

  optional uint64 mem_total = 8;
  optional uint64 mem_used = 9;
  optional uint64 mem_available = 10;
  optional uint64 mem_buffcache = 11;
  optional uint64 mem_zfs_arc = 12;
  optional uint64 swap_total = 13;
  optional uint64 swap_used = 14;

  optional double load1 = 15;
  optional double load5 = 16;
  optional double load15 = 17;

  optional uint64 uptime_s = 18;

  // --- /proc/stat, the lines the CPU collector steps over ---
  //
  // ctxt, intr and processes are monotonic counters. They are reported as
  // per-second rates computed agent-side, not as raw counters: detecting a
  // counter reset needs the previous value, which only the agent holds. The
  // hub never sees the reset and could not correct for one.
  optional double ctxt_per_s = 19;
  optional double intr_per_s = 20;
  optional double forks_per_s = 21;

  // Gauges, so unlike the rates above these are set on the very first scrape.
  optional uint32 procs_running = 22;
  optional uint32 procs_blocked = 23;

  // btime: an absolute unix timestamp, deliberately not derived from
  // uptime_s + ts_ms. That derivation drifts by a second or two per sample,
  // so "when did this host last reboot" would answer slightly differently for
  // every row of the same boot.
  optional uint64 boot_time_s = 24;

  // Count of numeric entries in /proc. Unset -- never 0 -- when the agent is
  // in a PID namespace and can see only itself.
  optional uint32 processes_total = 25;

  // USER_PROCESS records in /var/run/utmp. Unset when utmp is absent, which
  // is the normal case on a host with no utmp writer.
  optional uint32 users_logged_in = 26;

  // systemd unit summary. The fields land here so host_samples matches spec
  // 5.3; the collector that fills them is a later phase, until which they
  // stay NULL.
  optional uint32 services_total = 27;
  optional uint32 services_failed = 28;

  // --- /proc/net/snmp, Tcp: ---
  //
  // No tcp6_* mirror exists, on purpose. The Tcp: block is the RFC 1213 TCP
  // MIB, which Linux keeps as one family-agnostic counter set: these values
  // already include IPv6 connections. /proc/net/snmp6 has no Tcp6 block at
  // all -- it carries Ip6*, Icmp6* and Udp6* only -- so a tcp6_* field could
  // only duplicate the field above it or be permanently NULL. The IPv6 mirror
  // further down covers exactly what the kernel does account separately.
  optional double tcp_retrans_segs_per_s = 29;
  optional double tcp_out_rsts_per_s = 30;
  optional double tcp_in_errs_per_s = 31;
  optional double tcp_active_opens_per_s = 32;
  optional double tcp_passive_opens_per_s = 33;
  optional double tcp_attempt_fails_per_s = 34;

  // Gauge: connections currently established, not a counter.
  optional uint32 tcp_curr_estab = 35;

  // --- /proc/net/netstat, TcpExt: ---
  optional double tcp_listen_overflows_per_s = 36;
  optional double tcp_listen_drops_per_s = 37;

  // --- /proc/net/snmp, Udp: ---
  optional double udp_in_errors_per_s = 38;
  optional double udp_rcvbuf_errors_per_s = 39;
  optional double udp_sndbuf_errors_per_s = 40;
  optional double udp_no_ports_per_s = 41;

  // --- /proc/net/snmp, Ip: fragmentation and reassembly ---
  optional double ip_reasm_reqds_per_s = 42;
  optional double ip_reasm_fails_per_s = 43;
  optional double ip_frag_fails_per_s = 44;
  optional double ip_frag_creates_per_s = 45;

  // --- /proc/net/snmp6, Udp6 ---
  optional double udp6_in_errors_per_s = 46;
  optional double udp6_rcvbuf_errors_per_s = 47;
  optional double udp6_sndbuf_errors_per_s = 48;
  optional double udp6_no_ports_per_s = 49;

  // --- /proc/net/snmp6, Ip6 fragmentation and reassembly ---
  optional double ip6_reasm_reqds_per_s = 50;
  optional double ip6_reasm_fails_per_s = 51;
  optional double ip6_frag_fails_per_s = 52;
  optional double ip6_frag_creates_per_s = 53;

  // The agent's own telemetry for this scrape. Singular, not repeated: it is
  // 1:1 with (host_id, ts), so nesting it here means it rides the existing
  // ring buffer, partial drain and backfill paths unchanged, and the hub
  // stores it under the same natural key. It lands in its own table because
  // agent uptime and host uptime are different facts (spec 5.3).
  optional AgentSample agent = 54;
}

// AgentSample is the agent's telemetry about itself for one scrape.
//
// It carries the full column set of spec 5.3's agent_samples so the table is
// complete on arrival. The fields the Self collector owns stay unset until it
// lands, and unset means NULL rather than a fabricated zero.
message AgentSample {
  // Wall time spent running every collector for this scrape.
  optional uint32 scrape_duration_ms = 1;

  // Round-trip time of the most recent SUCCESSFUL post, as of this scrape.
  //
  // It necessarily lags by one scrape: the RTT of a post is only known inside
  // the post itself, which runs after this sample was built and buffered. It
  // is left unset -- never zeroed -- when the last flush failed, so an outage
  // reads as "no measurement" rather than "instantaneous".
  optional uint32 post_latency_ms = 2;

  // Set by the Self collector in a later phase.
  optional uint64 uptime_s = 3;
  optional uint64 rss_bytes = 4;
  optional uint32 goroutines = 5;

  optional uint32 buffer_depth = 6;
  optional uint64 buffer_dropped_total = 7;

  // Set by the Self collector in a later phase.
  optional uint64 post_failures_total = 8;
}

// ProcessSample is NOT DEFINED YET, and this note is here so that when it is,
// the decision below is already made.
//
// It may carry exactly: name, cpu_pct, mem_bytes, count.
//
// `name` is `comm` — /proc/PID/comm, or field 2 of /proc/PID/stat — which the
// kernel caps at 15 bytes. No field may ever carry argv or the environment.
// /proc/PID/cmdline is argv, and argv routinely carries credentials
// (`mysql -p<pass>`, `-Dspring.datasource.password=...`, `--token=...`);
// /proc/PID/environ is worse. Either on the wire turns netra into a credential
// exfiltration path with a database behind it, for an operator who enabled
// `pid: host` to see a CPU chart.
//
// The trap is that the dangerous implementation is the natural one: 15 bytes is
// an unsatisfying name and cmdline has the whole command in it. Enforced by
// internal/agent/collector/argv_guard_test.go, which fails the build rather
// than trusting review. See spec 6.2 for the accepted cost (truncated names,
// "python3" instead of the script).

// IngestResponse carries everything the hub would push over a socket.
message IngestResponse {
  uint64 ack_seq = 1;
  bool request_metadata = 2;

  // Set on a 503 (storage unavailable). The agent waits at least this long
  // before retrying, instead of using its own backoff.
  uint32 retry_after_s = 3;

  // Field 4 was interval_s: a hub-supplied scrape cadence the agent adopted.
  // Retired because the scrape interval is now fixed at 60s agent-side. The
  // hub has no per-host cadence column, so it could only ever hand back one
  // hardcoded constant — which silently overrode whatever the operator had
  // configured on the agent. A per-host override belongs to phase 2 and will
  // need a new field; 4 must never be reused.
  reserved 4;
  reserved "interval_s";
}
