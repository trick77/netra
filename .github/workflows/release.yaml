name: Release

# By hand only. Next plain tag from the bump, the hub and agent images (ship.yaml images) pushed to ghcr.io with
# their version, sha and moving tags, then the GitHub release. setup-agent.sh fetches deploy/agent/ at the newest
# tag, so a deploy/ change reaches hosts only with a release.
# gh workflow run Release -f bump=patch
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    uses: trick77/ship/.github/workflows/release.yaml@master
    with:
      bump: ${{ inputs.bump }}
      go-dir: backend
    permissions:
      contents: write
      packages: write
