name: CI

# Tests run on pull requests. Master builds and pushes images in a separate
# release workflow; no image build happens here.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Guard against the ldflags expansion order bug: LDFLAGS once used :=
      # and expanded before the VERSION/COMMIT assignments below it, so -X
      # stamped both symbols to the empty string and every shipped binary
      # reported no version at all.
      #
      # This checks the runtime value rather than grepping the binary: Go
      # embeds the VCS revision automatically, so the SHA is present either
      # way. It also builds with the defaults, because passing VERSION= on the
      # command line masks the bug -- command-line variables are defined
      # before the makefile is parsed, so := sees them.
      - name: Verify version stamping
        run: |
          make build
          sha="$(git rev-parse --short HEAD)"
          for b in bin/netra bin/netra-agent; do
            out="$("$b" --version)"
            echo "$b: $out"
            # The "?*" is load-bearing: a bare "*" also matches the empty
            # string, so a binary that stamped only the commit and left the
            # version empty ("netra  (commit abc, go...)") would still pass.
            case "$out" in
              "$(basename "$b") "?*" (commit $sha, go"*) ;;
              *) echo "::error::$b reported '$out', expected '$(basename "$b") <version> (commit $sha, go...)'"; exit 1 ;;
            esac
          done

      # gofmt is not covered by `go vet`, so it is enforced explicitly rather
      # than trusted to editors.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd. Run: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

  # The SPA is embedded in the hub binary, so a TypeScript error or a failing
  # component test is a broken release just as much as a Go compile error is —
  # but nothing else in this file would notice. `make build` does run `make ui`
  # (build-hub depends on it), which covers tsc and vite; it never runs the
  # Vitest suite. This job is what makes the UI tests part of the gate rather
  # than something run by hand.
  ui:
    name: Test (ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          # The version lives in ui/.nvmrc so the runner, the Containerfile's
          # node stage and a developer's `nvm use` cannot drift apart.
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # Runs tsc --noEmit and vite build; a type error fails here, not at
      # release time.
      - run: npm run build
        working-directory: ui
      # --coverage, because the thresholds in vite.config.ts are this half's
      # equivalent of hack/coverage-floors: a hard floor that fails the job,
      # not a number printed for someone to read.
      - run: npm run test:coverage
        working-directory: ui
      - name: Prettier
        run: npm run format:check
        working-directory: ui

  # setup-agent.sh is the one shipped artefact that is not Go, and it is the
  # piece most likely to be wrong in a way nobody notices: it runs once, on
  # somebody else's machine, against hardware this repo has never seen.
  #
  # The suite runs under BOTH sh and dash on purpose. shellcheck -s sh and a
  # real POSIX shell disagree at the edges — shellcheck misses some bashisms,
  # and ubuntu's /bin/sh is dash so `sh` alone would be the same interpreter
  # twice on this runner but bash-as-sh on a developer's mac. Running both is
  # what proves the linter and the interpreter agree.
  #
  # No fetch-depth: 0, no Python, no coverage steps. Shell files never enter
  # the Cobertura reports, so both coverage gates ignore them by construction —
  # coverage-gate.sh keys on hub|agent from hack/coverage-floors, and
  # patch-coverage.sh's assert_matched guard is invoked with *.go pathspecs, so
  # a shell-only PR returns an empty changed-set and exits early. No exclusion
  # list is added for them; a redundant exclude only invites deletion later.
  shell:
    name: Shell (setup script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck and dash
        run: sudo apt-get update && sudo apt-get install -y shellcheck dash
      - name: Lint
        run: |
          shellcheck -s sh setup-agent.sh
          shellcheck -s sh test/setup-agent/run.sh test/setup-agent/lib.sh \
            test/setup-agent/cases/*.sh
      - name: Suite under sh
        run: sh test/setup-agent/run.sh
      - name: Suite under dash
        run: dash test/setup-agent/run.sh

  test:
    name: Test (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # internal/sim is in `packages` but deliberately NOT in `coverpkg`:
          # its tests should run, but the simulator is a development tool
          # whose files must stay out of the coverage report. In coverpkg it
          # would drag the hub's floor down with code no shipped binary
          # contains; absent from the report entirely, it is also invisible to
          # the diff-cover patch gate.
          - component: hub
            packages: ./internal/hub/... ./internal/buildinfo/... ./internal/gen/... ./internal/sim/... ./cmd/netra/...
            coverpkg: ./internal/hub/...,./internal/buildinfo/...,./internal/gen/...,./cmd/netra/...
          - component: agent
            packages: ./internal/agent/... ./cmd/netra-agent/...
            coverpkg: ./internal/agent/...,./cmd/netra-agent/...
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: netra
          POSTGRES_PASSWORD: netra
          POSTGRES_DB: netra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # fetch-depth: 0 — hack/patch-coverage.sh diffs the branch against the
      # PR base, which needs real history. A shallow checkout leaves the base
      # ref unresolvable and the gate exits 2.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install diff-cover==10.3.0
      - run: mkdir -p coverage
      # The race detector needs cgo. This is independent of the
      # CGO_ENABLED=0 invariant used for the statically linked shipped
      # binaries.
      #
      # -coverpkg attributes coverage across package boundaries within a
      # component: code exercised only by another package's tests in the same
      # component would otherwise be reported as uncovered, understating the
      # real number badly. It is deliberately scoped to matrix.coverpkg
      # (hub's own packages, or agent's own packages) rather than ./... —
      # hub and agent share one go.mod, so a whole-module ./... here would
      # pull the OTHER component's untouched packages into this report at 0%
      # coverage and tank the score for a component that never exercises them.
      - name: Test
        run: |
          go test -p 1 -race -covermode=atomic -coverpkg=${{ matrix.coverpkg }} \
            -coverprofile=coverage/${{ matrix.component }}.out ${{ matrix.packages }}
        env:
          CGO_ENABLED: "1"
          NETRA_TEST_DSN: postgres://netra:netra@127.0.0.1:5432/netra_test
      # Go exposes no line metric — `go tool cover` reports statements only —
      # so the line percentage comes from a Cobertura conversion. That also
      # merges the duplicate blocks -coverpkg emits, one set per test binary,
      # which a naive sum over the raw profile gets badly wrong.
      - run: go run github.com/boumenot/gocover-cobertura@v1.5.0 < coverage/${{ matrix.component }}.out > coverage/${{ matrix.component }}.xml
      # The floor gate runs first: when a PR drops the project below the floor
      # the absolute number is the more actionable failure, and reporting it
      # before patch coverage keeps the log readable.
      - run: ./hack/coverage-gate.sh ${{ matrix.component }}
      - name: Patch coverage
        run: ./hack/patch-coverage.sh "origin/${{ github.base_ref || 'master' }}"
