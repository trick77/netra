<!--
  netra's icon: remix's "server-fill" painted onto a solid chip. This is the
  master — the other two sources here are copies of it, and it is the file that
  ships as /icon.svg as well as rendering the PWA rasters.

  A MACHINE, NOT A READING. netra watches a fleet of hosts, and two stacked
  units with an indicator on each are the thing the product is pointed at; the
  heartbeat trace that stood here before was a reading taken off one of them,
  which is a picture of the output rather than of the subject. At favicon size
  the distinction is also a legibility argument. A trace is one thin continuous
  line, and its thinnest run — the flat baseline, the part that says "trace"
  rather than "zigzag" — lands at about a pixel at 16px and had to be tuned up
  to survive; two solid bars with a gap between them are blocks, and the only
  feature that has to hold is the gap, which is 1.3 units of the chip's 18 and
  never in doubt. Remix ships this glyph as a fill, and it is used as one here,
  so there is no stroke weight in this file to tune at all.

  The path is remix's (Apache 2.0), copied rather than imported — nothing loads
  an icon library to draw a static asset.

  THE CHIP IS THE INK, and the mark sits on it — the same inversion peeq and
  ismimodown made, for the reason ismimodown's tile.svg states: filled, the
  silhouette is one solid object at any size, and the same object on every
  ground. Safari composites a tab icon onto a light favourites plate, Chrome
  onto its own dark strip, and a filled chip reads on both without either being
  humoured.

  The mark is PAINTED #131312 (netra's color-bg token — an XML comment cannot
  carry the token's own two-dash prefix), not punched through the chip. A real
  knockout would let whatever is behind the icon show through the mark, which
  on a light plate means a hollow-looking chip; the mark has to stay dark-on-warm
  wherever the icon lands.

  THE TWO INDICATOR SLOTS ARE the exception, and they are holes on purpose: each
  is a subpath wound against its own panel, so the nonzero fill rule drops it,
  and what shows through is the chip — which is opaque — never the page. They
  draw about 0.9px wide at 16px and largely close up there. That is intended:
  at tab size the mark is two bars and a gap, and the slots are detail the
  larger rasters get to keep.

  THE INK IS A GRADIENT, #e08a68 down to #c25f34 at roughly 145° — the family's
  ramp, byte for byte what peeq and ismimodown ship, so netra's chip sits flush
  with theirs in the same tab bar. It is NOT built from netra's own
  color-accent-fill: that token is #b85a30, darkened one step from #c25f34 so
  that white body text on a filled button clears 4.5:1. Nothing is written on
  this chip, so the constraint that produced #b85a30 does not reach it, and the
  ramp's midpoint is netra's color-accent (#d97757) either way. The gradient is
  in objectBoundingBox units, so it ramps across the chip's own box rather than
  across the canvas.

  Sized off the chip's TRUE bbox — x[3,21] y[3,21], 18 square, centred on
  (12,12) — not the nominal 24x24 box the path only partly fills. Scaling by the
  nominal box is what makes a glyph read as a dot at favicon sizes. The
  denominator is 18 and not 18+stroke: the chip is filled, so its drawn edge IS
  its geometric edge. Coverage is 1.0 here, matching peeq, which chose it so the
  family's marks are the same silhouette size beside each other.

  TRANSPARENT CANVAS, not a transparent icon: the chip itself is opaque, and
  only the four corners outside its rx-4 radius are clear, so what lands in a tab
  is a chip rather than a square tile. The two consumers that would flatten those
  corners — iOS onto black, Android onto the launcher's own fill — are served by
  the tiled sources beside this file, and hack/gen-icons.sh asserts both
  directions.

  THE TRANSFORMS ARE DERIVED, not typed:

    outer: scale = 64*C/18,          translate = 32 - 12*scale
    inner: scale = 12/18 = 0.666667, translate = 12*(1 - scale)

  where C is the file's coverage of the canvas: 1.0 here, 0.60 in icon-tile.svg,
  0.46 in icon-maskable.svg — peeq's three coverages, unchanged.

  The inner scale's denominator is 18 because 18 is the mark's DRAWN width.
  remix's server-fill spans x[3,21] and y[3,21] in its own 24-space, and it is a
  fill, so the path's bbox IS what draws — unlike the stroked trace it replaces,
  whose denominator was 19.8 because a 2.8-wide stroke with round caps added
  half its weight at each end of a 17-unit centreline. This is the one line that
  guarantees the mark's longest dimension draws at 12 of the chip's 18 units,
  which is what ismimodown's bars measure and therefore what makes these two
  icons look like siblings. The glyph is square, so both dimensions land on 12
  and neither is slack, and it is symmetric about (12,12) in both axes, so no
  optical nudge is needed.

  Change the glyph and the inner scale has to be recomputed from the new drawn
  width — a stroked replacement has to add its weight to the bbox before
  dividing — or the mark silently stops filling the coverage its own comment
  claims. Change a coverage and its outer transform follows.

  Regenerate the rasters with hack/gen-icons.sh after touching this file — and
  mirror any shape change into the two tiled sources beside it, which are copies
  and cannot follow on their own. Then rebuild the UI with `make ui`, so the new
  bytes land in internal/hub/web/dist, which is what the binary serves.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <g transform="translate(-10.6667 -10.6667) scale(3.55556)">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#og)"/>
    <g transform="translate(4 4) scale(0.666667)" fill="#131312">
      <path d="M4 3H20C20.5523 3 21 3.44772 21 4V11H3V4C3 3.44772 3.44772 3 4 3ZM3 13H21V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V13ZM7 16V18H10V16H7ZM7 6V8H10V6H7Z"/>
    </g>
  </g>
</svg>
