# netra hub — the central service that agents POST to and that stores metrics.
#
# Host prep before the first run:
#
#   mkdir -p data/timescaledb
#   cp .env.example .env && $EDITOR .env      # set the two secrets
#   docker compose up -d
#
# Agents are configured separately, on each monitored host — see
# deploy/agent/ and setup-agent.sh.
services:
  netra:
    image: ghcr.io/trick77/netra:latest
    restart: unless-stopped

    # netra is on BOTH networks, and that is not redundant. Traefik reaches it
    # over `traefik`; it reaches Postgres over `netra-internal`. On `traefik`
    # alone the container cannot resolve the hostname `timescaledb` at all and
    # every start fails on the DSN.
    networks:
      - traefik
      - netra-internal

    # Loopback only. This published port IS the interface: the read and admin
    # API are curl'd from the box itself, and the host management UI is served
    # on it at http://127.0.0.1:8080/. From a laptop, reach it through a
    # tunnel — ssh -L 8080:127.0.0.1:8080 <this host> — rather than by binding
    # 0.0.0.0 here.
    #
    # Binding 127.0.0.1 rather than 0.0.0.0 keeps the API and the UI off the
    # host's public interfaces — both are gated by a single shared admin
    # token, which is adequate for loopback and is not adequate for the
    # internet.
    #
    # NETRA_BIND_ADDR carries the address AND the port together, deliberately:
    # it exists so an operator whose host already has something on 8080 can
    # move netra from .env instead of editing this file, and splitting it into
    # separate IP and port variables would invite changing the port while
    # assuming the address stays pinned. Setting it to `0.0.0.0:8080` puts the
    # admin API and the UI on the host's public interfaces behind nothing but
    # the shared token — the paragraph above is the argument against that.
    ports:
      - "${NETRA_BIND_ADDR:-127.0.0.1:8080}:8080"

    # 512m, not unbounded. The hub is a Go process serving a handful of
    # agents; an unbounded default only means a leak takes the host down with
    # it. Raise this one line if the agent count grows.
    mem_limit: 512m

    environment:
      # Container-internal, and NOT derived from NETRA_BIND_ADDR: Traefik
      # dials this port over the `traefik` network and never sees the
      # published one, so it stays 8080 no matter where the host binding
      # moves. Same for the healthcheck below and the loadbalancer label.
      NETRA_LISTEN_ADDR: ":8080"
      # sslmode=disable is correct here and only here: this connection never
      # leaves the internal Docker network, and TLS between two containers on
      # the same host buys nothing but a certificate to rotate.
      NETRA_DB_DSN: "postgres://netra:${POSTGRES_PASSWORD}@timescaledb:5432/netra?sslmode=disable"
      # Required — the hub refuses to start without it rather than serving an
      # unauthenticated admin API.
      NETRA_ADMIN_TOKEN: "${NETRA_ADMIN_TOKEN}"
      NETRA_LOG_LEVEL: "${NETRA_LOG_LEVEL:-info}"
      # The address agents post to. Used only to render a ready-to-paste
      # setup-agent.sh command in the UI: the browser reaches the hub on
      # loopback, so the hub cannot infer its own agent-facing name from that
      # request. Unset renders a placeholder rather than a wrong URL.
      NETRA_HUB_URL: "https://${NETRA_HOSTNAME:-netra.example.com}"

    # /api/health reports database reachability, not just process liveness, so
    # a hub that cannot reach Postgres correctly goes unhealthy instead of
    # accepting ingest it will only 503. wget is busybox's, shipped in the
    # image for exactly this — see Containerfile.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3

    # service_healthy, not service_started: the hub runs migrations on startup
    # and a Postgres that is merely listening is not necessarily ready to
    # accept them.
    depends_on:
      timescaledb:
        condition: service_healthy

    labels:
      traefik.enable: "true"
      # Required because this container sits on two networks — without it
      # Traefik picks one arbitrarily and may route to the internal address.
      traefik.docker.network: traefik
      # PathPrefix, not Host alone. The only route that has any business being
      # reachable from the internet is agent ingest — everything else the hub
      # grows (the read API, the admin API that mints agent tokens and deletes
      # hosts, and the management UI at /) is behind the same shared token and
      # would otherwise become internet-facing the moment it was added,
      # silently, with no change to this file. That directly contradicts the
      # loopback-binding rationale above. Widen this deliberately, per route,
      # or not at all.
      traefik.http.routers.netra.rule: Host(`${NETRA_HOSTNAME:-netra.example.com}`) && PathPrefix(`/api/agent/`)
      traefik.http.routers.netra.entrypoints: websecure
      # tls: "true" with no certresolver — the certificate is pre-loaded in
      # Traefik's static config, so there is no ACME challenge to run here.
      traefik.http.routers.netra.tls: "true"
      traefik.http.services.netra.loadbalancer.server.port: "8080"

  timescaledb:
    # Pinned, deliberately not `latest-pg17`. That tag is right for the CI
    # service container, which starts from an empty volume every run, and
    # wrong here: an unattended `docker compose pull` would move the operator's
    # database out from under their data directory. Bump this on purpose.
    image: timescale/timescaledb:2.29.1-pg17
    restart: unless-stopped

    # Internal network only — never on `traefik`. Nothing outside this compose
    # project has any business reaching Postgres, and no port is published, so
    # it is not on the host's network either.
    networks:
      - netra-internal

    # Without a limit this container sizes itself from the WHOLE host: on a
    # 31GB/8CPU box the image's timescaledb-tune step wrote shared_buffers =
    # 7947MB and max_worker_processes = 27 for a database holding metrics from
    # a couple of monitored hosts.
    mem_limit: 2g

    environment:
      POSTGRES_USER: netra
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: netra
      # timescaledb-tune reads the host's /proc/meminfo, not this container's
      # cgroup limit, so mem_limit alone would leave it tuning for memory it
      # cannot have and being OOM-killed for using it. Keep both in step with
      # mem_limit above; the tuner then sizes shared_buffers from the 2GB it is
      # told about rather than from the host's total.
      #
      # These are read on FIRST INIT ONLY — the tune script runs from
      # docker-entrypoint-initdb.d. On a data directory that was already
      # initialised without them, see the upgrade note in README.md before
      # starting with mem_limit set.
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: "2"

    # A bind mount rather than a named volume so the data is where the operator
    # expects it and `tar czf` is a backup. Create it before the first run:
    # the directory must exist or Docker creates it root-owned and the
    # container's initdb fails.
    volumes:
      - ./data/timescaledb:/var/lib/postgresql/data

    # -U and -d are both needed: bare pg_isready checks the default database
    # `postgres`, which does not exist in this image's configuration, so the
    # check would pass on a server that cannot serve netra.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netra -d netra"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

networks:
  # Created outside this project and shared with every other Traefik-fronted
  # stack on the host: `docker network create traefik`.
  traefik:
    external: true
  # Project-local. Carries only the hub-to-Postgres connection.
  netra-internal:
