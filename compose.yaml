# netra hub — the central service that agents POST to and that stores metrics.
#
# Host prep before the first run:
#
#   mkdir -p data/timescaledb
#   cp .env.example .env && $EDITOR .env      # two secrets AND NETRA_HOSTNAME
#   docker compose up -d
#
# Agents are configured separately, on each monitored host — see
# deploy/agent/ and setup-agent.sh.
services:
  netra:
    image: ghcr.io/trick77/netra:latest
    restart: unless-stopped

    # netra is on BOTH networks, and that is not redundant. Traefik reaches it
    # over `traefik`; it reaches Postgres over `netra-internal`. On `traefik`
    # alone the container cannot resolve the hostname `timescaledb` at all and
    # every start fails on the DSN.
    networks:
      - traefik
      - netra-internal

    # No `ports:`, deliberately. Traefik reaches this container over the
    # `traefik` network on 8080 and is the only way in — nothing is published
    # on the host, so netra cannot collide with whatever else the box runs on
    # 8080 (Traefik's own dashboard, usually) and there is no tunnel to set up
    # to administer it.

    # 512m, not unbounded. The hub is a Go process serving a handful of
    # agents; an unbounded default only means a leak takes the host down with
    # it. Raise this one line if the agent count grows.
    mem_limit: 512m

    environment:
      # Container-internal. Traefik dials this port over the `traefik`
      # network; nothing on the host ever binds it, so it is fixed and has no
      # reason to be configurable. Same for the healthcheck below and the
      # loadbalancer label.
      NETRA_LISTEN_ADDR: ":8080"
      # sslmode=disable is correct here and only here: this connection never
      # leaves the internal Docker network, and TLS between two containers on
      # the same host buys nothing but a certificate to rotate.
      NETRA_DB_DSN: "postgres://netra:${POSTGRES_PASSWORD}@timescaledb:5432/netra?sslmode=disable"
      # Required — the hub refuses to start without it rather than serving an
      # unauthenticated admin API.
      NETRA_ADMIN_TOKEN: "${NETRA_ADMIN_TOKEN}"
      NETRA_LOG_LEVEL: "${NETRA_LOG_LEVEL:-info}"
      # The address agents post to. Used only to render a ready-to-paste
      # setup-agent.sh command in the UI: the hub sits behind Traefik and sees
      # a proxied request, so it cannot infer its own public name from one.
      #
      # Safe as a bare expansion ONLY because the router rule below marks
      # NETRA_HOSTNAME required with `:?`, so compose refuses to start rather
      # than reaching this line unset. Drop that `:?` and this becomes the
      # literal "https://", which the hub trims to "https:/" — non-empty, so
      # the UI renders it as a configured value and hands out a setup command
      # nobody can run.
      NETRA_HUB_URL: "https://${NETRA_HOSTNAME}"

    # /api/health reports database reachability, not just process liveness, so
    # a hub that cannot reach Postgres correctly goes unhealthy instead of
    # accepting ingest it will only 503. wget is busybox's, shipped in the
    # image for exactly this — see build/Containerfile.hub.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3

    # service_healthy, not service_started: the hub runs migrations on startup
    # and a Postgres that is merely listening is not necessarily ready to
    # accept them.
    depends_on:
      timescaledb:
        condition: service_healthy

    labels:
      traefik.enable: "true"
      # Required because this container sits on two networks — without it
      # Traefik picks one arbitrarily and may route to the internal address.
      traefik.docker.network: traefik
      # Host alone, so Traefik fronts the whole hub: agent ingest, the read
      # API, the admin API that mints agent tokens and deletes hosts, and the
      # management UI at /. Everything past ingest is gated on the single
      # shared NETRA_ADMIN_TOKEN, and on this router that token is what stands
      # between the admin API and the internet — so it is a credential, not a
      # convenience. Generate it with `openssl rand -hex 32` and treat losing
      # it as losing the fleet.
      #
      # `:?` rather than a default. A default here is worse than no value at
      # all: an operator who never set NETRA_HOSTNAME got a router matching a
      # domain this project does not own, compose started clean, the hub went
      # healthy, and agent ingest was unreachable with nothing anywhere saying
      # why. Now the run stops with the message below.
      traefik.http.routers.netra.rule: Host(`${NETRA_HOSTNAME:?set NETRA_HOSTNAME in .env — the name Traefik routes the hub on}`)
      traefik.http.routers.netra.entrypoints: websecure
      # tls: "true" with no certresolver — the certificate is pre-loaded in
      # Traefik's static config, so there is no ACME challenge to run here.
      traefik.http.routers.netra.tls: "true"
      # The hub emits plain JSON and nothing in the container compresses it.
      # The read API is float-heavy — one fleet render moves tens of thousands
      # of numbers — and that text compresses roughly tenfold, so this is the
      # cheapest thing on the page's critical path. Traefik skips responses
      # that already carry a Content-Encoding, so it does not double-handle.
      traefik.http.middlewares.netra-compress.compress: "true"
      traefik.http.routers.netra.middlewares: netra-compress
      traefik.http.services.netra.loadbalancer.server.port: "8080"

  timescaledb:
    # Pinned, deliberately not `latest-pg17`. That tag is right for the CI
    # service container, which starts from an empty volume every run, and
    # wrong here: an unattended `docker compose pull` would move the operator's
    # database out from under their data directory. Bump this on purpose.
    image: timescale/timescaledb:2.29.1-pg17
    restart: unless-stopped

    # Internal network only — never on `traefik`. Nothing outside this compose
    # project has any business reaching Postgres, and no port is published, so
    # it is not on the host's network either.
    networks:
      - netra-internal

    # Without a limit this container sizes itself from the WHOLE host: on a
    # 31GB/8CPU box the image's timescaledb-tune step wrote shared_buffers =
    # 7947MB and max_worker_processes = 27 for a database holding metrics from
    # a couple of monitored hosts.
    mem_limit: 2g

    environment:
      POSTGRES_USER: netra
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: netra
      # timescaledb-tune reads the host's /proc/meminfo, not this container's
      # cgroup limit, so mem_limit alone would leave it tuning for memory it
      # cannot have and being OOM-killed for using it. Keep both in step with
      # mem_limit above; the tuner then sizes shared_buffers from the 2GB it is
      # told about rather than from the host's total.
      #
      # These are read on FIRST INIT ONLY — the tune script runs from
      # docker-entrypoint-initdb.d. On a data directory that was already
      # initialised without them, see the upgrade note in README.md before
      # starting with mem_limit set.
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: "2"

    # A bind mount rather than a named volume so the data is where the operator
    # expects it and `tar czf` is a backup.
    #
    # No host-side chown. This container declares no `user:`, so its entrypoint
    # starts as root and chowns PGDATA to postgres (uid 70 in this Alpine-based
    # image, NOT 1000) before dropping privileges — verified against a
    # uid-1000-owned directory, which initdb reports as "fixing permissions on
    # existing directory ... ok". Chowning to your own uid on the host does not
    # help and chowning to 1000 is actively wrong.
    #
    # The `mkdir -p data/timescaledb` above is still worth doing: it puts the
    # directory where you chose, with your umask, instead of letting Docker
    # create it. The earlier claim here — that a root-owned directory makes
    # initdb fail — was backwards; root-owned is the case the entrypoint
    # handles best.
    #
    # Two consequences that ARE real:
    #   - after first start this directory is uid 70, mode 0700, so the
    #     `tar czf` backup above needs sudo.
    #   - under ROOTLESS Docker or `userns-remap`, container-root is not
    #     host-root, that chown is denied, and the entrypoint swallows the
    #     failure (`2>/dev/null || :`) before initdb dies on a directory it
    #     cannot write. Check with `docker info --format '{{.SecurityOptions}}'`;
    #     if it names rootless or userns, chown this directory to 70 yourself.
    volumes:
      - ./data/timescaledb:/var/lib/postgresql/data

    # -U and -d are both needed: bare pg_isready checks the default database
    # `postgres`, which does not exist in this image's configuration, so the
    # check would pass on a server that cannot serve netra.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netra -d netra"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

networks:
  # Created outside this project and shared with every other Traefik-fronted
  # stack on the host: `docker network create traefik`.
  traefik:
    external: true
  # Project-local. Carries only the hub-to-Postgres connection.
  netra-internal:
