# netra agent — RENDERED BY setup-agent.sh. Do not hand-edit in place; re-run
# the setup script (compose.yaml is overwritten freely, .env is not).
#
# The annotated reference that explains every mount, capability and device is
# compose.yaml.example next to this file. This template is deliberately terse:
# it is generated output, not documentation.
#
# ---------------------------------------------------------------------------
# HOW THIS TEMPLATE IS SUBSTITUTED
# ---------------------------------------------------------------------------
# Substitution happens by WHOLE MARKER LINES, never by inline tokens. Each
# `#__NETRA_*__` line below is replaced in full by a rendered block, and a block
# that is empty deletes its marker line entirely. That is how a conditional
# `cap_add:` or `pid: host` vanishes without leaving a dangling key behind: the
# KEY ITSELF lives inside the block, not in this file.
#
# The consequence, and the reason for the design: this file is valid YAML as it
# stands (every marker is a comment), so it can be linted and reviewed on its
# own without running the setup script.
services:
  netra-agent:
    image: ghcr.io/trick77/netra-agent:latest
    restart: unless-stopped

    # Required, not a convenience: the network collector reads /proc/net/dev and
    # the address collector talks netlink, both of which see the container's
    # veth pair instead of the host's interfaces without this. An agent must
    # therefore NOT also declare `networks:` — Compose rejects that combination.
    network_mode: host

    env_file:
      - .env

    security_opt:
      - no-new-privileges:true

