# netra agent — RENDERED BY setup-agent.sh. Do not hand-edit in place; re-run
# the setup script (compose.yaml is overwritten freely, .env is not).
#
# The annotated reference that explains every mount, capability and device is
# compose.yaml.example next to this file. This template is deliberately terse:
# it is generated output, not documentation.
#
# ---------------------------------------------------------------------------
# HOW THIS TEMPLATE IS SUBSTITUTED
# ---------------------------------------------------------------------------
# Substitution happens by WHOLE MARKER LINES, never by inline tokens. Each
# `#__AGENT_*__` line below is replaced in full by a rendered block, and a block
# that is empty deletes its marker line entirely. That is how a conditional
# `cap_add:` or `devices:` vanishes without leaving a dangling key behind: the
# KEY ITSELF lives inside the block, not in this file.
#
# `pid: host` is NOT one of them. It is unconditional -- a monitoring agent that
# cannot see the host's process namespace reports no per-container network and
# no process count -- so it is a literal line here rather than a rendered block.
#
# The consequence, and the reason for the design: this file is valid YAML as it
# stands (every marker is a comment), so it can be linted and reviewed on its
# own without running the setup script.
services:
  netra-agent:
    image: ghcr.io/trick77/netra-agent:latest
    restart: unless-stopped

    # Required, not a convenience: the network collector reads /proc/net/dev and
    # the address collector talks netlink, both of which see the container's
    # veth pair instead of the host's interfaces without this. An agent must
    # therefore NOT also declare `networks:` — Compose rejects that combination.
    network_mode: host

    env_file:
      - .env

    security_opt:
      - no-new-privileges:true

    pid: host
    volumes:
      - type: bind
        source: "/.netra"
        target: /netra/fs/root
        read_only: true
      - type: bind
        source: "/mnt/ark/.netra"
        target: /netra/fs/ark
        read_only: true
      - type: bind
        source: "/sys/fs/cgroup"
        target: /host/sys/fs/cgroup
        read_only: true
      - type: bind
        source: "/dev"
        target: /dev
        read_only: true
      - type: bind
        source: "/var/run/docker.sock"
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: "/proc/1/mountinfo"
        target: /host/mountinfo
        read_only: true
      - type: bind
        source: "/etc/machine-id"
        target: /etc/machine-id
        read_only: true
      - type: bind
        source: "/etc/os-release"
        target: /host/etc/os-release
        read_only: true
      - type: bind
        source: "/run/dbus/system_bus_socket"
        target: /run/dbus/system_bus_socket
        read_only: true
      - type: bind
        source: "/var/lib/dpkg"
        target: /var/lib/dpkg
        read_only: true
      - type: bind
        source: "/var/run/utmp"
        target: /var/run/utmp
        read_only: true
    device_cgroup_rules:
      - "b *:* rmw"
      - "c *:* rmw"
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
